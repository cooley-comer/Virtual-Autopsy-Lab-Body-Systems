<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PBS Virtual Autopsy Lab</title>
<style>
:root{--navy:#0B1F3A;--teal:#1F7F8B;--red:#9B1B0A;--coral:#E8604C;--gold:#F2B84B;--pink:#FADBD8;--light:#F1F4F7;--ink:#1A1A1A;--gray:#5C6B7A;--green:#1E7A46;}
*{box-sizing:border-box}
body{margin:0;font-family:Calibri,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#fff;line-height:1.45}
header{background:var(--navy);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-family:Cambria,Georgia,serif;font-size:20px;margin:0;flex:1;min-width:220px}
header small{display:block;color:var(--gold);font-family:Calibri,Arial,sans-serif;font-size:13px;font-weight:normal}
.chip{background:var(--red);color:#fff;border-radius:999px;padding:6px 16px;font-weight:700;font-size:15px}
.progress{display:flex;gap:5px;padding:10px 20px;background:var(--light);flex-wrap:wrap}
.dot{width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid #b8c2cc;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--gray)}
.dot.cur{border-color:var(--red);color:var(--red)}
.dot.done{background:var(--teal);border-color:var(--teal);color:#fff}
main{max-width:1100px;margin:0 auto;padding:20px}
.card{background:var(--light);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.card.pink{background:var(--pink)} .card.gold{background:#fdf0cf}
h2{font-family:Cambria,Georgia,serif;color:var(--navy);margin:0 0 8px}
h3{color:var(--navy);margin:0 0 6px}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:10px 20px;cursor:pointer;background:var(--red);color:#fff}
button:hover:not(:disabled){filter:brightness(1.12)}
button:disabled{background:#b8c2cc;cursor:not-allowed}
button.alt{background:var(--navy)} button.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input[type=text],select{font:inherit;padding:8px 10px;border:2px solid #9aa5b1;border-radius:8px;min-width:200px;background:#fff}
.lab{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
@media(max-width:820px){.lab{grid-template-columns:1fr}}
.bodywrap{background:#e9f3f5;border-radius:12px;padding:10px;position:sticky;top:10px;text-align:center}
.bodywrap svg{width:100%;max-width:260px;height:auto}
.badge{display:inline-block;background:var(--teal);color:#fff;border-radius:6px;padding:2px 10px;font-size:13px;font-weight:700;margin-bottom:6px}
ul.find{margin:8px 0 0;padding-left:22px} ul.find li{margin:3px 0}
.q{background:#fff;border:2px solid #d5dce2;border-radius:10px;padding:14px 16px;margin:12px 0}
.q.ok{border-color:var(--green)} .q.bad{border-color:var(--coral)}
.q .pts{float:right;font-size:13px;color:var(--gray);font-weight:700}
.opt{display:block;margin:6px 0;padding:8px 10px;border-radius:8px;border:1px solid #d5dce2;cursor:pointer}
.opt:hover{background:var(--light)} .opt input{margin-right:8px}
.fb{margin-top:10px;padding:10px 12px;border-radius:8px;font-size:15px}
.fb.ok{background:#dff3e6} .fb.bad{background:#fde3df}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
table{border-collapse:collapse;width:100%} th,td{border:1px solid #c5ced6;padding:6px 10px;text-align:left} th{background:var(--navy);color:#fff}
.code{font-family:Consolas,monospace;word-break:break-all;background:#fff;border:2px dashed var(--navy);padding:10px;border-radius:8px;font-size:13px}
.big{font-size:54px;font-weight:700;color:var(--red);font-family:Cambria,Georgia,serif;line-height:1}
.sr{position:absolute;left:-9999px}
/* body svg */
.org{opacity:.14;transition:opacity .4s,filter .4s}
.org.on{opacity:1;filter:drop-shadow(0 0 5px #F2B84B)}
#incision{stroke:#9B1B0A;stroke-width:3;fill:none;stroke-dasharray:400;stroke-dashoffset:400;transition:stroke-dashoffset 1.2s}
#incision.cut{stroke-dashoffset:0}
@media print{header .chip,.progress,.noprint{display:none}}
</style>
</head>

<header>
  <h1><span id="hTitle"></span><small id="hSub"></small></h1>
  <button id="langBtn" class="ghost" style="padding:6px 14px"></button>

</header>
<div class="progress" id="progress" aria-label="Progress"></div>
<main id="stage"></main>

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\b(the|a|an|el|la|los|las|un|una)\b/g," ").replace(/\s+/g," ").trim();}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function stationMax(si){var t=0;ST[si].qs.forEach(function(q){t+=q.pts;});return t;}

   var dis=a?" disabled":"";
   if(q.t==="mc"){optsFor(si,qi).forEach(function(oi){h+='<label class="opt"><input type="radio" name="q'+qi+'" value="'+oi+'"'+dis+(a&&a.given===oi?" checked":"")+'>'+esc(q.opts[oi])+'</label>';});}
   else if(q.t==="fill"){h+='<p style="margin:8px 0 0"><input type="text" id="f'+qi+'" autocomplete="off" aria-label="'+U.ansLbl+'" value="'+(a?esc(a.given):"")+'"'+dis+'></p>';}
   else{h+='<p style="margin:8px 0 0"><select id="s'+qi+'" aria-label="'+U.chooseLbl+'"'+dis+'><option value="">'+U.choose+'</option>'+q.opts.map(function(o,oi){return '<option value="'+oi+'"'+(a&&a.given===oi?" selected":"")+'>'+esc(o)+'</option>';}).join("")+'</select></p>';}
   if(!a)h+='<div class="row"><button class="alt chk" data-qi="'+qi+'">'+U.check+'</button></div>';
   else h+='<div class="fb '+(a.ok?"ok":"bad")+'" role="status">'+(a.ok?"<b>"+U.ok+"</b> ":"<b>"+U.bad+"</b> "+U.ansIs+" "+esc(answerText(q))+". ")+esc(q.ex)+'</div>';
   h+='</div>';});
  var last=si===ST.length-1;
  h+='<div class="row"><span>'+U.stnScore+': <b>'+stationScore(si)+' / '+stationMax(si)+'</b></span><button id="next"'+(stationDone(si)?"":" disabled")+'>'+(last?U.finish:U.next)+'</button></div>';
 }
 h+='</div></div>';stage.innerHTML=h;setBody(si);
 var ex=document.getElementById("exam");if(ex)ex.onclick=function(){S.seen[si]=true;save();render();};
 stage.querySelectorAll(".chk").forEach(function(b){b.onclick=function(){var qi=+b.dataset.qi,q=st.qs[qi],given="";
  if(q.t==="mc"){var r=stage.querySelector('input[name="q'+qi+'"]:checked');given=r?+r.value:"";}
  else if(q.t==="fill")given=document.getElementById("f"+qi).value.trim();
  else{var sv=document.getElementById("s"+qi).value;given=sv===""?"":+sv;}
  if(given===""){alert(U.needAns);return;}
  grade(si,qi,given);render();};});
 var nx=document.getElementById("next");if(nx)nx.onclick=function(){if(si===ST.length-1){S.screen="results";save();render();window.scrollTo(0,0);doDownload();}else{S.i=si+1;save();render();window.scrollTo(0,0);}};}

function fnv(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h.toString(36);}
function makeCode(){var p=ST.map(function(s,i){return stationScore(i);});var o={n:S.name,s:totalScore(),p:p,c:CASE.id,d:new Date().toISOString().slice(0,10),l:S.lang};
 var b=btoa(unescape(encodeURIComponent(JSON.stringify(o))));return b+"."+fnv(b+SALT);}
function readCode(c){c=(c||"").trim().split(/\s+/).pop()||"";var i=c.lastIndexOf(".");if(i<1)return null;var b=c.slice(0,i),h=c.slice(i+1);
 if(fnv(b+SALT)!==h)return {valid:false};try{var o=JSON.parse(decodeURIComponent(escape(atob(b))));o.valid=true;return o;}catch(e){return {valid:false};}}
function fileName(){return U.fileBase+S.name.replace(/[^A-Za-z0-9\u00C0-\u017F]+/g,"_")+".txt";}
function fileText(){var tot=totalScore();var t=U.fHead+"\n"+U.fName+": "+S.name+"\n"+U.fCase+": "+CASE.id+"\n"+U.fScore+": "+tot+" / "+TOTAL+"\n\n";
 ST.forEach(function(s,i){t+=U.fStn+" "+(i+1)+" ("+s.sys+"): "+stationScore(i)+" / "+stationMax(i)+"\n";});
 t+="\n"+U.fDetail+":\n";
 ST.forEach(function(s,si){s.qs.forEach(function(q,qi){var a=S.ans[qid(si,qi)]||{};t+=(si+1)+"."+(qi+1)+" ["+(a.ok?U.fRight:U.fWrong)+"] "+(a.given===undefined?U.none:givenText(q,a))+"\n";});});
 t+="\n"+U.fCode+":\n"+makeCode()+"\n";return t;}
function doDownload(){try{var b=new Blob([fileText()],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=fileName();document.body.appendChild(a);a.click();a.remove();S.dl=true;S.dlName=fileName();save();if(S.screen==="results")render();}catch(e){}}

function renderResults(){
 var tot=totalScore(),code=makeCode();
 var rows=ST.map(function(s,i){return "<tr><td>"+(i+1)+"</td><td>"+esc(s.sys)+": "+esc(s.title)+"</td><td>"+stationScore(i)+" / "+stationMax(i)+"</td></tr>";}).join("");
 var review=ST.map(function(s,si){return '<details><summary><b>'+U.stn+' '+(si+1)+': '+esc(s.sys)+'</b></summary>'+s.qs.map(function(q,qi){var a=S.ans[qid(si,qi)]||{};
   return '<p style="margin:6px 0 6px 12px">'+(a.ok?"✔ ":"✘ ")+esc(q.q)+'<br>'+U.yours+': '+esc(a.given===undefined?U.none:givenText(q,a))+(a.ok?"":'<br>'+U.corr+': <b>'+esc(answerText(q))+'</b>')+'</p>';}).join("")+'</details>';}).join("");
 var banner=S.dl?'<div class="card" style="background:#dff3e6"><h3>'+U.doneT+'</h3><p>'+U.doneB+' <b>'+esc(S.dlName||fileName())+'</b></p><button class="alt" id="dl">'+U.again+'</button></div>'
  :'<div class="card" style="background:#fde3df;border:3px solid #9B1B0A"><h3>'+U.reqT+'</h3><p>'+U.reqB+'</p><button id="dl">'+U.reqBtn+'</button></div>';
 var codeCard=S.dl?'<div class="card pink"><h3>'+U.codeT+'</h3><p>'+U.codeH+'</p><div class="code" id="codebox">'+esc(code)+'</div><div class="row noprint"><button id="cp">'+U.copy+'</button><button class="ghost" id="pr">'+U.print+'</button></div><p id="cpmsg" aria-live="polite"></p></div>':'';
 document.getElementById("stage").innerHTML=
 '<div class="card"><h2>'+U.complete+': '+esc(S.name)+'</h2><div class="big">'+tot+' / '+TOTAL+'</div><p>'+Math.round(tot/TOTAL*100)+'% · '+U.caseW+' '+CASE.id+'</p></div>'+banner+
 '<div class="card"><h3>'+U.byStn+'</h3><table><tr><th>#</th><th>'+U.stnCol+'</th><th>'+U.ptsCol+'</th></tr>'+rows+'</table></div>'+codeCard+
 '<div class="card"><h3>'+U.review+'</h3>'+review+'</div>'+
 '<details class="card noprint"><summary><b>'+U.teacher+'</b></summary><p>'+U.tHelp+'</p><textarea id="tc" rows="3" style="width:100%"></textarea> <button class="alt" id="tv" style="margin-top:8px">'+U.verify+'</button><div id="tout" style="margin-top:10px"></div><hr><button class="ghost" id="reset">'+U.reset+'</button></details>';
 document.getElementById("dl").onclick=doDownload;
 var cp=document.getElementById("cp");if(cp)cp.onclick=function(){var m=document.getElementById("cpmsg");try{navigator.clipboard.writeText(code).then(function(){m.textContent=U.copied;},function(){m.textContent=U.copyManual;});}catch(e){m.textContent=U.copyManual;}};
 var pr=document.getElementById("pr");if(pr)pr.onclick=function(){window.print();};
 document.getElementById("tv").onclick=function(){var o=readCode(document.getElementById("tc").value),out=document.getElementById("tout");
  if(!o||!o.valid){out.innerHTML='<div class="fb bad">'+U.invalid+'</div>';return;}
  out.innerHTML='<div class="fb ok"><b>'+U.valid+'</b> '+esc(o.n)+' '+U.scored+' <b>'+o.s+' / '+TOTAL+'</b> '+U.on+' '+esc(o.d)+' ('+U.caseW+' '+esc(o.c)+').<br>'+U.stations+': '+o.p.map(function(x,i){return (i+1)+"="+x;}).join(", ")+'</div>';};
 document.getElementById("reset").onclick=function(){if(confirm(U.resetQ)){try{localStorage.removeItem(KEY);}catch(e){}var lg=S.lang;S={name:"",screen:"intro",i:0,ans:{},seen:{},order:{},dl:false,dlName:"",lang:lg};render();}};}

function render(){updateChrome();if(S.screen==="intro")renderIntro();else if(S.screen==="lab")renderLab();else renderResults();}
load();if(!D[S.lang])S.lang=DEFAULT_LANG;setLang(S.lang);
document.getElementById("langBtn").onclick=function(){setLang(S.lang==="en"?"es":"en");save();render();};
render();

</script>
</body>
